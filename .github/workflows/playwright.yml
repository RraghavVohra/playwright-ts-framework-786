name: Playwright Tests
# WHEN to trigger this workflow
on:
  # workflow_dispatch = manual trigger only
  # You go to GitHub → Actions → Run workflow → click button
  # Tests run ONLY when YOU decide — no automatic triggers
   workflow_dispatch:
     inputs:
       environment:
         description: 'Environment to run tests against'
         required: true
         default: 'digipulse'
         type: choice
         options:
           - digipulse
           - prod
           - preprod
           - dev
       workers:
         # How many tests run truly simultaneously against Azure's cloud browsers.
         # Higher = faster, but more concurrent load on the target server. Default 1
         # matches local behavior and is the reliable choice — raise it only if you're
         # specifically trading reliability for speed. See Fixes.md for why (concurrent
         # workers were triggering 403 Forbidden / timeouts on digipulse under load).
         description: 'Parallel workers (1 = reliable/slow, higher = faster/riskier)'
         required: true
         default: '4'
         type: choice
         options:
           - '1'
           - '2'
           - '4'
           - '8'

# WHAT to run
jobs:
  test:
    # Maximum time this job can run before GitHub kills it
    timeout-minutes: 60
    # Which machine to run on — GitHub's Ubuntu Linux server
    runs-on: ubuntu-latest
    # Selects the GitHub "Environment" matching the chosen input —
    # each environment (digipulse/prod/preprod/dev) can define its own
    # USER_EMAIL/USER_PASSWORD secrets under the same names.
    # If an environment has no secrets of its own, repo-level secrets are used as fallback.
    environment: ${{ inputs.environment }}
     # NEW — SHARDING (15 Aug 2026)
    # Before this, the job ran ALL tests as one single job (one orchestrator,
    # one machine). This "strategy: matrix" block tells GitHub Actions to spin up
    # 4 SEPARATE parallel jobs instead — one per shardIndex (1,2,3,4). Each job
    # gets its own runner, its own auth.setup.ts login, its own set of workers.
    # fail-fast: false = if one shard fails, the other 3 keep running instead of
    # GitHub cancelling everything (each shard's result is independent).
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    # LIST OF STEPS — executed top to bottom in order
    steps:
    # Step 1 — Pull your code from GitHub onto the runner machine
    - uses: actions/checkout@v4
    # Step 2 — Install Node.js version 24 on the runner machine
    - uses: actions/setup-node@v4
      with:
        node-version: 24

    # Step 3 — Install all packages from package.json
    # npm ci = clean install — faster and more reliable than npm install in CI
    - name: Install dependencies
      run: npm ci

    # Step 4 — Login to Microsoft Azure
    # Uses AZURE_CREDENTIALS secret stored in GitHub → Settings → Secrets
    # This authenticates GitHub Actions to use your Azure workspace  
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
   # Step 5 — Run Playwright tests on Azure cloud
    # PLAYWRIGHT_SERVICE_URL tells Playwright to use Azure cloud browsers
    # --config = use Azure service config instead of local config
    # --workers = how many tests run in parallel, chosen from the dropdown above
    # vars.PLAYWRIGHT_SERVICE_URL = URL stored in GitHub Variables
    - name: Run Playwright tests
    - nametwo: Debug secret length (temporary)
  run: |
     echo "USER_EMAIL length: ${#USER_EMAIL}"
     echo "USER_PASSWORD length: ${#USER_PASSWORD}"
      env:
         PLAYWRIGHT_SERVICE_URL : ${{ vars.PLAYWRIGHT_SERVICE_URL }}
         ENV: ${{ inputs.environment }}
         USER_EMAIL: ${{ secrets.USER_EMAIL }}
         USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
         WORKERS: ${{ inputs.workers }}
    # NEW — SHARDING (15 Aug 2026)
    # Original command only had --workers. Added --shard=X/Y so each of the 4
    # parallel jobs above only runs its own 1/4th slice of the 104 tests
    # (~26 tests per shard), instead of all 4 jobs redundantly running all 104.
      run: npx playwright test --config=playwright.service.config.ts --workers=${{ inputs.workers }} --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    # Step 6 — Upload test report as artifact to GitHub
    # The if statement means-> upload report even if tests failed
    # retention-days: 30 = report stays available for 30 days
    # Download from GitHub → Actions → your run → Artifacts section
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
      # NEW — SHARDING (15 Aug 2026)
      # Original name was just "playwright-report" (no variable). Since all 4
      # shards now run this same step, they'd all try to upload an artifact
      # with the SAME name and clash/overwrite. Adding ${{ matrix.shardIndex }}
      # makes each one unique: playwright-report-1, playwright-report-2, etc.
        name: playwright-report-${{ matrix.shardIndex }}
        path: azure-report/
        retention-days: 30

  api-tests:
    name: API Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    # Step 1 — Pull code
    - uses: actions/checkout@v4

    # Step 2 — Install Node.js
    - uses: actions/setup-node@v4
      with:
        node-version: 24

    # Step 3 — Install dependencies
    - name: Install dependencies
      run: npm ci

    # NOTE: No "npx playwright install" step here — the 'api' project in
    # playwright.config.ts has no browser/device config, so no browser
    # binaries are needed. Saves CI time compared to the UI job.

    # Step 4 — Run API tests against digipulse
    - name: Run API tests
      env:
        BASE_URL: https://app.digipulsesp.in
        TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
        TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      run: npx playwright test --project=api

    # Step 5 — Upload report even if tests fail
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: api-test-report
        path: playwright-report/
        retention-days: 30
