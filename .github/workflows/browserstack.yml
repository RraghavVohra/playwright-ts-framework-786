name: BrowserStack Cross-Browser

on:
  workflow_dispatch:

jobs:
  browserstack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: digipulse
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Create empty auth state for setup project
        run: echo '{"cookies":[],"origins":[]}' > auth.json

      - name: Run smoke on BrowserStack
        run: npx browserstack-node-sdk playwright test tests/e2e/testimonials.spec.ts
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          ENV: digipulse
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}